name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALICE_DATABASE_URL: postgresql://alice_app:alice-app-ci-password@127.0.0.1:5432/alice_ci
      ALICE_MIGRATION_DATABASE_URL: postgresql://alice:alice-ci-password@127.0.0.1:5432/alice_ci
      ALICE_TEST_DATABASE_URL: postgresql://alice:alice-ci-password@127.0.0.1:5432/alice_ci
      ALICE_APPLICATION_DATABASE_ROLE: alice_app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: alice-ci-password
          POSTGRES_DB: alice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alice -d alice_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Create constrained PostgreSQL application role
        run: >-
          psql "$ALICE_MIGRATION_DATABASE_URL" --set ON_ERROR_STOP=1
          --command "CREATE ROLE alice_app LOGIN PASSWORD 'alice-app-ci-password'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"

      - name: Migrate empty PostgreSQL database
        run: npm run db:migrate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check for leaked secrets
        run: npm run check:secrets

      - name: Evaluate capture tool selection
        run: npm run eval:capture

      - name: Evaluate cross-host context
        run: npm run eval:context

      - name: Test
        run: npm test

      - name: Test PostgreSQL constraints and concurrency
        run: npm run test:postgres

      - name: Verify PostgreSQL backup and restore
        run: npm run db:backup:verify

      - name: Build deployables
        run: npm run build
