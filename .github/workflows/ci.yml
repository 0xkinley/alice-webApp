name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check for leaked secrets
        run: npm run check:secrets

      - name: Evaluate capture tool selection
        run: npm run eval:capture

      - name: Evaluate cross-host context
        run: npm run eval:context

      - name: Test
        run: npm test

      - name: Build deployables
        run: npm run build
