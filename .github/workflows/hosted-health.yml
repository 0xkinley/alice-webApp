name: Hosted health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public contracts
    if: ${{ vars.ALICE_HOSTED_WEB_ORIGIN != '' && vars.ALICE_HOSTED_MCP_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Probe health and MCP metadata
        env:
          ALICE_HOSTED_WEB_ORIGIN: ${{ vars.ALICE_HOSTED_WEB_ORIGIN }}
          ALICE_HOSTED_MCP_ORIGIN: ${{ vars.ALICE_HOSTED_MCP_ORIGIN }}
        run: node scripts/probe-hosted-services.mjs
